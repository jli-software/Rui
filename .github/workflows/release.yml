# Baut Rui für Windows und Linux und hängt beides ans Release.
#
# Ausgelöst von einem Tag `v*`. Der Grund für CI ist nicht Bequemlichkeit,
# sondern Vollständigkeit: von Hand gebaut fehlte in 0.3.3 bis 0.3.6 jedes
# Mal die Windows-Binary, weil dafür eine zweite Maschine nötig war. Hier
# laufen beide Plattformen nebeneinander, und ohne beide gibt es kein Release.
#
# `workflow_dispatch` baut dasselbe, veröffentlicht aber nichts — der
# Trockenlauf, bevor ein Tag gesetzt wird.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    # Bewusst nicht `ubuntu-latest`: eine auf 24.04 gebaute Binary verlangt
    # dessen glibc und startet auf älteren Distributionen nicht mehr.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Systempakete für Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential curl wget file patchelf

      - run: npm ci

      - name: Versionen prüfen
        run: npm run check:version

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Bauen und packen
        run: |
          ./scripts/build-release.sh
          ./scripts/package-linux.sh

      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: release/rui-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Versionen prüfen
        run: npm run check:version

      - name: Bauen
        shell: pwsh
        run: ./scripts/build-release.ps1

      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: |
            release/rui.exe
            release/rui-setup.exe
            release/rui-setup.msi
          if-no-files-found: error

  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Voller Klon: die Release-Notiz kommt aus CHANGELOG.md, der Titel aus
      # der Beschriftung des Tags.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # checkout legt den Tag als blosses Etikett auf dem Commit an, ohne das
      # annotierte Objekt dahinter — `contents:subject` griffe dann auf die
      # Commit-Message durch und die stünde als Titel über dem Release.
      - name: Tag-Objekt nachholen
        run: git fetch --tags --force origin

      # Nicht nach `assets/` — so heisst im Repository schon der Ordner mit
      # Logo und Screenshots, und der landete dann mit im Release.
      - uses: actions/download-artifact@v5
        with:
          path: paket
          merge-multiple: true

      - name: Release zusammenstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          # Der Tag und alle Stellen, die eine Versionsnummer tragen, müssen
          # übereinstimmen. Sonst kann das Release anders heissen als Binary,
          # Installer oder Lockdatei.
          node scripts/check-version.mjs --tag "$tag"

          # Lieber hier hart abbrechen als ein halbes Release veröffentlichen.
          for datei in rui.exe rui-setup.exe rui-setup.msi rui-linux-x86_64.tar.gz; do
            [ -f "paket/$datei" ] || { echo "$datei fehlt im Paket" >&2; exit 1; }
          done

          # Getrennt schreiben und erst dann hineinlegen, damit die Liste
          # sich nicht selbst enthält.
          (cd paket && sha256sum *) > SHA256SUMS.txt
          mv SHA256SUMS.txt paket/

          # Titel und Text kommen aus der Beschriftung des Tags: erste Zeile der
          # Titel, der Rest die Notiz — beides englisch wie das README. Der
          # ausführliche Changelog bleibt deutsch im Repository; die Release-Seite
          # ist das Schaufenster nach aussen und nennt nur, was sich geändert hat.
          #
          # Die Prüfung auf den Objekttyp ist die Versicherung dagegen, dass sonst
          # die Commit-Message als Titel über dem Release landet.
          titel=""
          text=""
          if [ "$(git cat-file -t "$tag")" = "tag" ]; then
            titel="$(git tag -l --format='%(contents:subject)' "$tag")"
            text="$(git tag -l --format='%(contents:body)' "$tag")"
          fi
          [ -n "$titel" ] || titel="Rui $version"

          # Die Nummer gehört in den Titel, nicht nur an den Tag daneben: in
          # der Release-Liste steht sonst eine Überschrift ohne Bezug, und
          # welche Fassung dahinter liegt, sieht man erst beim Aufklappen — so
          # geschehen in 0.3.9. Ergänzt wird still statt abzubrechen: ein
          # fertiger Build aus zwei Plattformen darf nicht an einer
          # Beschriftung scheitern, die sich hier korrigieren lässt.
          case "$titel" in
            *"$version"*) ;;
            *) titel="Rui $version — $titel" ;;
          esac

          if [ -n "$text" ]; then
            printf '%s\n\n' "$text" > notiz.md
          else
            : > notiz.md
          fi

          cat >> notiz.md <<EOF
          ## Install

          **Linux**

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/jli-software/Rui/main/install.sh | bash
          \`\`\`

          Then \`rui file.txt\` in a terminal, or *Rui* in the application launcher.
          Remove it again with \`~/.local/share/rui/install.sh --uninstall\`.

          **Windows**

          \`rui-setup.exe\` to install, \`rui.exe\` to just run it, \`rui-setup.msi\` for
          Intune and GPO. Not code-signed, so SmartScreen warns on first launch
          (*More info* → *Run anyway*).

          Full changelog (German):
          https://github.com/${GITHUB_REPOSITORY}/blob/$tag/CHANGELOG.md
          EOF

          gh release create "$tag" \
            --title "$titel" \
            --notes-file notiz.md \
            paket/*
