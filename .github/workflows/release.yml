# Baut Rui für Windows und Linux und hängt beides ans Release.
#
# Ausgelöst von einem Tag `v*`. Der Grund für CI ist nicht Bequemlichkeit,
# sondern Vollständigkeit: von Hand gebaut fehlte in 0.3.3 bis 0.3.6 jedes
# Mal die Windows-Binary, weil dafür eine zweite Maschine nötig war. Hier
# laufen beide Plattformen nebeneinander, und ohne beide gibt es kein Release.
#
# `workflow_dispatch` baut dasselbe, veröffentlicht aber nichts — der
# Trockenlauf, bevor ein Tag gesetzt wird.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # Bewusst nicht `ubuntu-latest`: eine auf 24.04 gebaute Binary verlangt
    # dessen glibc und startet auf älteren Distributionen nicht mehr.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Systempakete für Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential curl wget file patchelf

      - run: npm ci

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Bauen und packen
        run: |
          ./scripts/build-release.sh
          ./scripts/package-linux.sh

      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: release/rui-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Bauen
        shell: pwsh
        run: ./scripts/build-release.ps1

      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: |
            release/rui.exe
            release/rui-setup.exe
            release/rui-setup.msi
          if-no-files-found: error

  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # Voller Klon: die Release-Notiz kommt aus CHANGELOG.md, der Titel aus
      # der Beschriftung des Tags.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Nicht nach `assets/` — so heisst im Repository schon der Ordner mit
      # Logo und Screenshots, und der landete dann mit im Release.
      - uses: actions/download-artifact@v5
        with:
          path: paket
          merge-multiple: true

      - name: Release zusammenstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          # Stimmt der Tag nicht mit der Version im Projekt überein, ist das
          # kein Schönheitsfehler: dann trägt die Binary eine andere Nummer
          # als das Release, unter dem sie liegt.
          in_conf="$(node -p "require('./package.json').version")"
          if [ "$version" != "$in_conf" ]; then
            echo "Tag $tag passt nicht zu package.json ($in_conf)" >&2
            exit 1
          fi

          # Lieber hier hart abbrechen als ein halbes Release veröffentlichen.
          for datei in rui.exe rui-setup.exe rui-setup.msi rui-linux-x86_64.tar.gz; do
            [ -f "paket/$datei" ] || { echo "$datei fehlt im Paket" >&2; exit 1; }
          done

          # Getrennt schreiben und erst dann hineinlegen, damit die Liste
          # sich nicht selbst enthält.
          (cd paket && sha256sum *) > SHA256SUMS.txt
          mv SHA256SUMS.txt paket/

          # Der Abschnitt dieser Version aus dem Changelog, ohne die
          # Vergleichslinks am Dateiende.
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { drin = 1; next }
            drin && /^## \[/ { exit }
            drin && /^\[.*\]: http/ { exit }
            drin { print }
          ' CHANGELOG.md > notiz.md

          cat >> notiz.md <<'EOF'

          ## Installation

          **Linux**

          ```bash
          curl -fsSL https://raw.githubusercontent.com/vikingjunior12/Rui/main/install.sh | bash
          ```

          Danach `rui datei.txt` im Terminal und „Rui" im Anwendungsstarter.
          Wieder weg mit `~/.local/share/rui/install.sh --uninstall` oder
          demselben Einzeiler mit `| bash -s -- --uninstall`.

          **Windows**

          `rui-setup.exe` für die Installation, `rui.exe` zum blossen Starten,
          `rui-setup.msi` für Intune und GPO. Die Builds sind nicht signiert,
          SmartScreen fragt beim ersten Start nach (*Weitere Informationen* →
          *Trotzdem ausführen*).
          EOF

          # Beschriftung des Tags als Titel, sonst nur die Versionsnummer.
          titel="$(git tag -l --format='%(contents:subject)' "$tag")"
          [ -n "$titel" ] || titel="Rui $version"

          gh release create "$tag" \
            --title "$titel" \
            --notes-file notiz.md \
            paket/*
