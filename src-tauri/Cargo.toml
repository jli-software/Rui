[package]
name = "rui"
version = "0.2.5"
description = "A lean text editor for snippets and notes"
authors = ["Jonas Gaiching"]
edition = "2021"
license = "MIT"
repository = "https://github.com/vikingjunior12/Rui"
homepage = "https://github.com/vikingjunior12/Rui"
readme = "../README.md"
keywords = ["editor", "tauri", "notes", "codemirror"]

[lib]
name = "rui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Encoding-Erkennung: chardetng rät, encoding_rs dekodiert/kodiert.
# Beide von Mozilla, gehören zusammen.
encoding_rs = "0.8"
chardetng = "0.1"

# Omarchy-Theme: colors.toml lesen, auf Änderung reagieren.
toml = "0.8"
notify = "6"

# Lokalzeit für die Datumsnamen von Notizen. Liegt über tauri ohnehin schon
# mit `clock` im Baum, kostet also nichts zusätzlich — und eine Notiz, die um
# 23:30 entsteht, soll nicht auf den nächsten Tag datiert sein.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
