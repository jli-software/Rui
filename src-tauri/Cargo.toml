[package]
name = "rui"
version = "0.6.0"
description = "A lean text editor for snippets and notes"
authors = ["Jonas Gaiching"]
edition = "2021"
license = "MIT"
repository = "https://github.com/jli-software/Rui"
homepage = "https://github.com/jli-software/Rui"
readme = "../README.md"
keywords = ["editor", "tauri", "notes", "codemirror"]

[lib]
name = "rui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Encoding-Erkennung: chardetng rät, encoding_rs dekodiert/kodiert.
# Beide von Mozilla, gehören zusammen.
encoding_rs = "0.8"
chardetng = "0.1"

# Omarchy-Theme: colors.toml lesen, auf Änderung reagieren.
toml = "0.8"
notify = "6"

# Lokalzeit für die Datumsnamen von Notizen. Liegt über tauri ohnehin schon
# mit `clock` im Baum, kostet also nichts zusätzlich — und eine Notiz, die um
# 23:30 entsteht, soll nicht auf den nächsten Tag datiert sein.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tauri-plugin-clipboard-manager = "2.3.2"
tempfile = "3"

[dev-dependencies]
filetime = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Storage_FileSystem"] }
winreg = "0.56.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
